name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typescript:
    name: TypeScript (typecheck, tests, conformance)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: reconnexus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RECONNEXUS_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/reconnexus
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Apply database migrations
        run: npm run rn -- config migrate
      - name: Type check
        run: npm run typecheck
      - name: Unit / integration / security tests
        run: npm test
      - name: TS/Go scope conformance
        run: npm run conformance

  go:
    name: Go (vet, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: workers/go.sum
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
